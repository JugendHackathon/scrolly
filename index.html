<!DOCTYPE html>
<head>
    <title>Hackathon 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">

    <script src="index.js" defer></script>
    <style>
        html {
            height: 100%;
        }

        body {
            background-color: black;
            margin: 0;
            padding: 0;
            min-height: 100dvh;
        }

        #smiley {
            height: 100%; 
        }   

        #logo {
            height: 100%;
        }

        #timer { 
            color: #f9e103;
            font-size: 7dvh;
            font-family: "Sniglet", system-ui;
            font-weight: 400;
            font-style: normal;
            width: 1.5em;
            text-align: right;
        }

        #rahmen {
            background-color: black;
            
            border-top: 0;
            border-left: 0;
            border-right: 0;
            border-bottom: solid 3px  #f9e103;

            padding: 10px;

            display: flex;
            flex-direction: row;
            justify-content: space-between;

            position: sticky;
            top: 0;

            height: 8dvh;
        }

        #video {
            padding: 0;
            min-height: 92dvh;
            width: 100%;
        }
        
        #pause {            
            padding: 0;
            min-height: 85dvh;
            width: 100%;
            display: none;  /* Wird gezeigt wenn der Timer abgelaufen ist */

            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        #pause img {
            width: 50dvw;
            display:block;
            margin-left:auto;
            margin-right:auto;
        }

        #tollerbutton {
            background-color: black;
            border: 3px solid #f9e103;
            border-radius: 1dvh;
            color: #f9e103;
            font-size: 7dvh;
            font-family: "Sniglet", system-ui;
            font-weight: 400;
            font-style: normal;
        }

        #weiterbutton {
            background-color: black;
            color: #f9e103;
            border: 1px solid #f9e103;
            border-radius: 1dvh;
            font-size: 2dvh;
            font-family: "Sniglet", system-ui;
            font-weight: 400;
            font-style: normal;
        }

    </style>
</head>
<body>
    <div id="rahmen">
        <img id="smiley" src="smiley1.jpg"></img>
        <img id="logo" src="logo.jpg"></img>
         <button id="weiterbutton">Nächstes Video</button>
        <div id="timer"></div>
    </div>
    
    <div id="pause">
        <img src="pause.jpg"></img>
        <button id="tollerbutton">Zurück zu TikTok</button>   
    </div>

    <iframe id="video" src="https://www.tiktok.com/player/v1/6718335390845095173?music_info=1&description=1&autoplay=1&loop=1&play_button=0" allowfullscreen></iframe>
</body>
